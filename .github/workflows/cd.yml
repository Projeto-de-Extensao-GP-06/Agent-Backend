name: CD - Agent (Build e Deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-agent

jobs:
  build-and-push:
    name: Build Imagem Docker + Push ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do cÃ³digo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem para o ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "âœ… Imagem $IMAGE_URI enviada para o ECR"

  deploy:
    name: Deploy nas EC2s via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descobrir instÃ¢ncias de Backend e atualizar container agent via SSM
        run: |
          echo "Buscando instÃ¢ncias ativas de backend..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-backend-a,ec2-backend-b" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "âš ï¸ Nenhuma EC2 de backend ativa encontrada no momento (ambiente desligado/destroy)."
            echo "âœ… A nova imagem jÃ¡ foi publicada no Amazon ECR com sucesso! Quando a infraestrutura for recriada, ela subirÃ¡ com essa versÃ£o."
            exit 0
          fi

          echo "InstÃ¢ncias encontradas: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/app-backend && docker compose pull agent && docker compose up -d agent"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Aguardando execuÃ§Ã£o..."
          sleep 25

          FAILED=0
          for ID in $INSTANCE_IDS; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status $ID: $STATUS"
            if [ "$STATUS" != "Success" ]; then
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "âŒ Deploy do Agent falhou em uma ou mais instÃ¢ncias!"
            exit 1
          fi

          echo "âœ… Agent atualizado com sucesso em todas as instÃ¢ncias!"

